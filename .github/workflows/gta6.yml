name: gta6-monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json pendientes.md
          git diff --cached --quiet || (git commit -m "update seen" && git push)